<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void:    #03040a;
  --deep:    #070b16;
  --surface: #0c1120;
  --glass:   rgba(10,15,28,0.78);
  --edge:    rgba(100,150,255,0.14);
  --ice:     #a0bfff;
  --frost:   #d8e8ff;
  --mist:    #607090;
  --ghost:   #304060;
  --accent:  #4f80ff;
  --accent2: #9b72f8;
  --ff-head: 'Sora', sans-serif;
  --ff-body: 'Inter', sans-serif;
  --ff-mono: 'JetBrains Mono', monospace;
  --ease-expo:   cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
}

html, body { width:100%; height:100%; overflow:hidden; background:var(--void); font-family:var(--ff-body); color:var(--frost); }
#cosmos { position:fixed; inset:0; z-index:0; display:block; }

.noise {
  position:fixed; inset:0; z-index:1; opacity:0.022; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;
}

.scan {
  position:fixed; left:0; right:0; top:0; height:2px; z-index:5; pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(79,128,255,0.4),transparent);
  animation:scan-move 10s linear infinite;
}
@keyframes scan-move {
  0%  { top:-2px; opacity:0; }
  5%  { opacity:1; }
  94% { opacity:0.25; }
  100%{ top:100vh; opacity:0; }
}

/* ── HUD: panel tersebar di sudut layar, bagian tengah dibiarkan kosong untuk tata surya ── */
#cosmos { touch-action:none; cursor:grab; }
body.dragging, body.dragging #cosmos, body.dragging .hud > * { cursor:grabbing; user-select:none; -webkit-user-select:none; }
@keyframes card-in {
  from { opacity:0; transform:translateY(40px) scale(0.96); }
  to   { opacity:1; transform:none; }
}
.hud { position:fixed; inset:0; z-index:10; pointer-events:none; }
.hud > * { position:absolute; pointer-events:auto; touch-action:none; }

.id-panel {
  top:clamp(18px,3vw,36px); left:clamp(18px,3vw,40px);
  display:flex; align-items:center; gap:16px;
  padding:14px 24px 14px 16px;
  background:rgba(8,12,24,0.5);
  border:1px solid var(--edge);
  border-radius:20px;
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(79,128,255,0.05) inset, 0 24px 60px rgba(0,0,0,0.45);
  animation:card-in 1.4s var(--ease-expo) both;
}
.id-panel::before {
  content:''; position:absolute; top:0; left:18px; right:18px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(79,128,255,0.7),rgba(155,114,248,0.9),rgba(79,128,255,0.7),transparent);
}
.id-text { text-align:left; min-width:0; }

.dock {
  bottom:clamp(18px,3vw,36px);
  width:min(270px,42vw);
  display:flex; flex-direction:column; gap:8px;
}
.dock-left  { left:clamp(18px,3vw,40px); }
.dock-right { right:clamp(18px,3vw,40px); }
.dock:empty { display:none; }

.hint {
  position:fixed; left:0; width:100%; bottom:50px; z-index:10;
  text-align:center; pointer-events:none;
  font-family:var(--ff-mono); font-size:0.6rem; letter-spacing:0.26em; text-transform:uppercase;
  color:rgba(160,191,255,0.5);
  animation:card-in 1.5s var(--ease-expo) 1.4s both, hint-out 1.2s ease 10s forwards;
  transition:opacity .8s ease;
}
body.dragged .hint { opacity:0 !important; animation:none; }
@keyframes hint-out { to { opacity:0; } }

/* ── AVATAR ── */
.avatar-wrap {
  position:relative; display:inline-flex; flex-shrink:0;
  align-items:center; justify-content:center;
  margin:0 6px 0 4px;
  animation:card-in 1.5s var(--ease-expo) 0.1s both;
}
.orbit-ring {
  position:absolute; inset:-8px; border-radius:50%;
  border:1px solid transparent;
  background:
    linear-gradient(var(--void),var(--void)) padding-box,
    conic-gradient(from 0deg,
      rgba(79,128,255,0.9), rgba(155,114,248,0.9),
      rgba(240,180,41,0.6), rgba(79,128,255,0.9)
    ) border-box;
  animation:spin 9s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.orbit-dot {
  position:absolute; top:-3px; left:50%; transform:translateX(-50%);
  width:5px; height:5px; border-radius:50%;
  background:var(--accent2);
  box-shadow:0 0 10px var(--accent2), 0 0 20px var(--accent2);
}
.avatar {
  width:72px; height:72px; border-radius:50%;
  background:linear-gradient(145deg,#0f1a30,#1a2540);
  border:2px solid rgba(79,128,255,0.25);
  display:flex; align-items:center; justify-content:center;
  position:relative; z-index:1; overflow:hidden;
  box-shadow:0 0 30px rgba(79,128,255,0.16), inset 0 1px 0 rgba(255,255,255,0.06);
}
.avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.avatar-initials {
  font-family:var(--ff-head);
  font-size:20px; font-weight:500;
  color:var(--ice); letter-spacing:2px;
}

/* ── IDENTITY ── */
.name {
  font-family:var(--ff-head);
  font-size:clamp(1.35rem,3.5vw,1.65rem);
  font-weight:600; color:#fff; letter-spacing:-0.01em; line-height:1.1;
}
.name span { color:var(--ice); font-weight:400; }
.handle {
  font-family:var(--ff-mono);
  font-size:0.6rem; letter-spacing:0.24em; text-transform:uppercase;
  color:var(--accent); margin-top:6px; font-weight:300;
}
.tagline {
  font-size:0.72rem; font-weight:300; color:var(--mist);
  margin-top:5px; letter-spacing:0.07em;
}

/* ── LINK BUTTONS ── */
.links { display:flex; flex-direction:column; gap:7px; }
.link-btn {
  position:relative;
  display:flex; align-items:center; gap:12px;
  padding:10px 13px;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(79,128,255,0.1);
  border-radius:10px;
  color:var(--frost); cursor:pointer; overflow:hidden;
  text-align:left; font-family:inherit; width:100%;
  transition:border-color .3s, background .3s,
             transform .3s var(--ease-spring), box-shadow .3s;
}
.link-btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(100deg,
    transparent 0%, rgba(79,128,255,0.06) 40%,
    rgba(155,114,248,0.08) 60%, transparent 100%
  );
  transform:translateX(-120%);
  transition:transform .55s ease;
}
.link-btn:hover::before { transform:translateX(120%); }
.link-btn:hover {
  border-color:rgba(79,128,255,0.35);
  background:rgba(79,128,255,0.05);
  transform:translateX(5px) translateY(-1px);
  box-shadow:0 6px 24px rgba(79,128,255,0.1),-3px 0 0 var(--accent);
}
.link-btn:active { transform:translateX(2px) scale(0.99); }
.ico {
  width:34px; height:34px; border-radius:9px;
  border:1px solid var(--edge); background:rgba(255,255,255,0.03);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; overflow:hidden;
  transition:border-color .3s, background .3s, transform .3s var(--ease-spring);
}
.link-btn:hover .ico {
  border-color:rgba(79,128,255,0.4); background:rgba(79,128,255,0.1);
  transform:scale(1.1) rotate(-6deg);
}
.ico img { width:20px; height:20px; object-fit:contain; display:block; }
.btn-text { flex:1; min-width:0; }
.btn-title {
  display:block; font-family:var(--ff-head);
  font-size:0.72rem; font-weight:500;
  color:#fff; letter-spacing:0.06em; text-transform:uppercase;
}
.btn-sub {
  display:block; font-size:0.63rem; color:var(--mist);
  margin-top:1px; font-weight:300;
}
.arrow {
  color:var(--ghost); font-size:13px; flex-shrink:0;
  transition:transform .3s var(--ease-spring), color .3s;
}
.link-btn:hover .arrow { transform:translateX(5px); color:var(--accent); }
.links .link-btn:nth-child(1){ animation:card-in 1.5s var(--ease-expo) 0.45s both; }
.links .link-btn:nth-child(2){ animation:card-in 1.5s var(--ease-expo) 0.55s both; }
.links .link-btn:nth-child(3){ animation:card-in 1.5s var(--ease-expo) 0.65s both; }
.links .link-btn:nth-child(n+4){ animation:card-in 1.5s var(--ease-expo) 0.75s both; }
.dock .link-btn {
  background:rgba(8,12,24,0.52);
  border-color:rgba(79,128,255,0.16);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 12px 36px rgba(0,0,0,0.4);
}
.dock-right .link-btn:hover {
  transform:translateX(-5px) translateY(-1px);
  box-shadow:0 6px 24px rgba(79,128,255,0.1), 3px 0 0 var(--accent);
}
.dock-right .link-btn:hover .arrow { transform:translateX(5px); }
.btn-sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.footer {
  position: fixed;
  bottom: 22px;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 10;
  pointer-events: none;
  font-family: var(--ff-mono);
  font-size: 0.6rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(79,128,255,0.28);
  animation: card-in 1.5s var(--ease-expo) 1s both;
}

/* ── MODAL ── */
.overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(3,4,10,0.9); backdrop-filter:blur(30px);
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none;
  transition:opacity .35s ease;
}
.overlay.open { opacity:1; pointer-events:auto; }
.modal {
  background:rgba(10,15,28,0.96);
  border:1px solid var(--edge);
  border-radius:6px;
  padding:48px 36px 36px;
  width:min(390px,100%);
  text-align:center; position:relative; overflow:hidden;
  box-shadow:0 0 0 1px rgba(79,128,255,0.06) inset, 0 80px 140px rgba(0,0,0,0.92);
  transform:translateY(28px) scale(0.95);
  transition:transform .45s var(--ease-spring);
}
.overlay.open .modal { transform:none; }
.modal::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),var(--accent),transparent);
  opacity:0.8;
}
.modal-glow {
  position:absolute; top:-50px; left:50%; transform:translateX(-50%);
  width:180px; height:100px;
  background:radial-gradient(ellipse,rgba(79,128,255,0.14),transparent 70%);
  pointer-events:none;
}
.modal-ico {
  width:64px; height:64px; border-radius:50%;
  border:1px solid var(--edge); background:rgba(255,255,255,0.03);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 20px;
  box-shadow:0 0 30px rgba(79,128,255,0.12); overflow:hidden;
}
.modal-ico img { width:38px; height:38px; object-fit:contain; display:block; }
.modal-title {
  font-family:var(--ff-head);
  font-size:1.55rem; font-weight:600; color:#fff;
  letter-spacing:-0.01em; margin-bottom:6px;
}
.modal-domain {
  font-family:var(--ff-mono);
  font-size:0.63rem; color:var(--mist);
  letter-spacing:0.14em; margin-bottom:18px;
}
.saweria-card {
  border:1px solid rgba(155,114,248,0.22);
  background:rgba(155,114,248,0.05);
  border-radius:4px; padding:16px; margin-bottom:18px;
  font-size:0.8rem; color:var(--ice); line-height:1.7; font-weight:300;
}
.heart-pulse { display:inline-block; font-style:normal; animation:hb 1.2s ease-in-out infinite; }
@keyframes hb { 0%,100%{transform:scale(1)} 40%{transform:scale(1.4)} 60%{transform:scale(1.2)} }
.modal-desc { font-size:0.8rem; color:var(--mist); line-height:1.7; margin-bottom:28px; font-weight:300; }
.modal-actions { display:flex; gap:10px; }
.btn-cancel,.btn-go {
  flex:1; padding:12px; border-radius:4px;
  font-family:var(--ff-mono); font-size:0.68rem;
  letter-spacing:0.16em; text-transform:uppercase;
  cursor:pointer; font-weight:300; transition:all .22s ease;
}
.btn-cancel { background:transparent; border:1px solid var(--ghost); color:var(--mist); }
.btn-cancel:hover { border-color:var(--mist); color:var(--frost); }
.btn-go {
  background:transparent; border:1px solid var(--accent);
  color:var(--accent); position:relative; overflow:hidden;
}
.btn-go::before {
  content:''; position:absolute; inset:0; background:var(--accent);
  transform:scaleX(0); transform-origin:left; transition:transform .28s ease;
}
.btn-go:hover::before { transform:scaleX(1); }
.btn-go:hover { color:var(--void); box-shadow:0 0 22px rgba(79,128,255,0.35); }
.btn-go span { position:relative; z-index:1; }

/* ── CLOSE BUTTON ── */
.close-btn {
  position: fixed;
  top: 22px;
  right: 24px;
  z-index: 50;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(10, 15, 28, 0.72);
  border: 1px solid rgba(79, 128, 255, 0.18);
  color: var(--mist);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: border-color .3s, background .3s, color .3s, transform .3s var(--ease-spring), box-shadow .3s;
  animation: card-in 1.5s var(--ease-expo) 0.8s both;
}
.close-btn:hover {
  border-color: rgba(255, 90, 90, 0.55);
  background: rgba(255, 60, 60, 0.1);
  color: #ff8080;
  transform: rotate(90deg) scale(1.1);
  box-shadow: 0 0 20px rgba(255, 60, 60, 0.18);
}
.close-btn:active { transform: rotate(90deg) scale(0.95); }
.close-btn svg {
  width: 16px; height: 16px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round;
}

/* ── MOBILE ── */
@media (max-width: 600px) {

  html, body {
    overflow: hidden;
    height: 100%; width: 100%;
    touch-action: none;
  }

  #cosmos { position: fixed; inset: 0; z-index: 0; }

  /* Identitas: ringkas di kiri atas */
  .id-panel {
    top: max(12px, calc(env(safe-area-inset-top, 0px) + 6px)); left: 14px;
    padding: 9px 16px 9px 10px; gap: 10px; border-radius: 16px;
  }
  .id-panel::before { left: 14px; right: 14px; }
  .avatar-wrap { margin: 0 4px 0 3px; }
  .avatar { width: 46px; height: 46px; border-width: 1.5px; }
  .avatar-initials { font-size: 14px; letter-spacing: 1.5px; }
  .orbit-ring { inset: -5px; }
  .orbit-dot { width: 4px; height: 4px; top: -2px; }
  .name { font-size: 1.05rem; letter-spacing: -0.02em; }
  .tagline { font-size: 0.6rem; margin-top: 3px; letter-spacing: 0.05em; color: rgba(96,112,144,0.9); }

  /* Tautan: dua kolom di bawah, Matahari tetap bebas di tengah */
  .dock {
    bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 10px));
    width: calc(50% - 20px); gap: 7px;
  }
  .dock-left  { left: 14px; }
  .dock-right { right: 14px; }
  .link-btn { padding: 8px 10px; gap: 9px; border-radius: 12px; }
  .link-btn::before { display: none; }
  .link-btn:active { transform: scale(0.985); border-color: rgba(79,128,255,0.28); }
  .ico { width: 30px; height: 30px; border-radius: 8px; }
  .ico img { width: 18px; height: 18px; }
  .btn-title { font-size: 0.62rem; letter-spacing: 0.05em; }
  .btn-sub   { font-size: 0.55rem; margin-top: 1px; color: rgba(96,112,144,0.8); }
  .arrow     { display: none; }

  .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); font-size: 0.54rem; }
  .scan  { display: none; }
  .footer { display: none; }

  /* ── Close button ── */
  .close-btn {
    top: max(12px, env(safe-area-inset-top, 0px));
    right: 13px;
    width: 32px; height: 32px;
    background: rgba(4, 7, 16, 0.62);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-color: rgba(79,128,255,0.14);
  }


  /* ── Modal ── */
  .modal {
    padding: 34px 20px 26px;
    width: 100%; max-width: 360px;
    margin: 0 auto;
    border-radius: 20px;
    border: 1px solid rgba(79,128,255,0.15);
  }
  .modal-actions { flex-direction: column; gap: 8px; }
  .btn-cancel, .btn-go {
    padding: 12px;
    border-radius: 10px;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
  }
  .btn-cancel { background: rgba(255,255,255,0.03); }
  .modal-title  { font-size: 1.28rem; }
  .modal-domain { font-size: 0.57rem; letter-spacing: 0.13em; }
}
#handleEl{
    visibility: hidden;
}
</style>
</head>
<body>

<!-- Secrets di-load dari config.js yang di-generate GitHub Actions -->
<script>
// Flag global — di-set true setelah config.js selesai load
window.__configReady = false;
window.__configCallback = null;

function __onConfigLoaded() {
  window.__configReady = true;
  if (typeof window.__configCallback === 'function') {
    window.__configCallback();
  }
}

(function() {
  var base = window.location.pathname.replace(/\/[^/]*$/, '/');

  function loadScript(src, onSuccess, onFail) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = onSuccess;
    s.onerror = onFail;
    document.head.appendChild(s);
  }

  loadScript(
    base + 'config.js',
    __onConfigLoaded,
    function() {
      console.warn('[config] Gagal dari: ' + base + 'config.js, coba root...');
      loadScript('/config.js', __onConfigLoaded, function() {
        console.warn('[config] Gagal juga dari root — pakai fallback');
        __onConfigLoaded();
      });
    }
  );
})();
</script>

<canvas id="cosmos"></canvas>
<div class="noise"></div>
<div class="scan"></div>

<!-- CLOSE BUTTON -->
<button class="close-btn" onclick="if(!window.close()) window.history.back()" title="Tutup halaman" aria-label="Tutup halaman">
  <svg viewBox="0 0 16 16">
    <line x1="2" y1="2" x2="14" y2="14"/>
    <line x1="14" y1="2" x2="2" y2="14"/>
  </svg>
</button>

<div class="hud">
  <!-- Identitas — kiri atas -->
  <header class="id-panel">
    <div class="avatar-wrap">
      <div class="orbit-ring"><div class="orbit-dot"></div></div>
      <div class="avatar" id="avatarEl">
        <span class="avatar-initials">RD</span>
      </div>
    </div>
    <div class="id-text">
      <h1 class="name" id="nameEl">Robertus <span>Danan</span></h1>
      <p class="handle" id="handleEl"></p>
      <p class="tagline" id="taglineEl">Creator · Developer · Dreamer</p>
    </div>
  </header>

  <!-- Tautan — kiri bawah & kanan bawah (diisi JS) -->
  <nav class="links dock dock-left"  id="linksLeft"></nav>
  <nav class="links dock dock-right" id="linksRight"></nav>
</div>

<p class="hint">◂ &nbsp; geser untuk mengitari matahari &nbsp; ▸</p>
<p class="footer" id="footerEl">⁝ &nbsp; @robertusdanan &nbsp; ⁝</p>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="bgClose(event)">
  <div class="modal" id="modal">
    <div class="modal-glow"></div>
    <div class="modal-ico" id="mIco"></div>

// ─── SUPABASE FETCH ───────────────────────────────────
async function sbGet(table, query = '') {
  if (!SUPABASE_URL || !SUPABASE_ANON) return null;
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}${query ? '?' + query : ''}`;
    const res = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${SUPABASE_ANON}`,
        'Accept': 'application/json',
      },
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) return null;
    return res.json();
  } catch { return null; }
}

// ─── RENDER FUNCTIONS ─────────────────────────────────
let LINKS = [];

function renderProfile(profile, avatarType, avatarB64) {
  const parts = profile.name.split(' ');
  const first = parts[0];
  const rest  = parts.slice(1).join(' ');
  document.getElementById('nameEl').innerHTML =
    rest ? `${first} <span>${rest}</span>` : first;
  document.getElementById('handleEl').textContent  = profile.handle;
  document.getElementById('taglineEl').textContent = profile.tagline;
  document.getElementById('footerEl').innerHTML =
    `⁝ &nbsp; ${profile.handle} &nbsp; ⁝`;

  if (avatarB64 && avatarB64 !== 'empty') {
    document.getElementById('avatarEl').innerHTML =
      `<img src="data:image/${avatarType};base64,${avatarB64}" alt="${profile.name}"/>`;
  }
}

function renderLinks(links) {
  LINKS = links;
  const btn = (link, i) => `
    <button class="link-btn" onclick="openModal(${i})">
      <div class="ico">${iconSmall(link, i)}</div>
      <div class="btn-text">
        <span class="btn-title">${link.label}</span>
        <span class="btn-sub">${link.sub}</span>
      </div>
      <span class="arrow">&#x2192;</span>
    </button>`;
  // Bagi dua: separuh pertama di kiri bawah, sisanya di kanan bawah
  const half = Math.ceil(links.length / 2);
  document.getElementById('linksLeft').innerHTML  = links.slice(0, half).map((l, k) => btn(l, k)).join('');
  document.getElementById('linksRight').innerHTML = links.slice(half).map((l, k) => btn(l, half + k)).join('');
}

// ─── MAIN INIT ────────────────────────────────────────
async function init() {
  // Fetch profile
  const profileRows = await sbGet('profile', 'limit=1');
  let profile, avatarType = 'jpeg', avatarB64 = 'empty';

  if (profileRows && profileRows[0]) {
    const row = profileRows[0];
    profile    = {
      name:    row.name    || 'Robertus Danan',
      handle:  row.handle  || '@robertusdanan',
      tagline: row.tagline || 'Creator · Developer · Dreamer',
    };
    avatarType = row.avatar_type || 'jpeg';
    avatarB64  = row.avatar_data  || 'empty';
  } else {
    profile = FALLBACK_PROFILE;
  }
  renderProfile(profile, avatarType, avatarB64);

  // Fetch links
  const linkRows = await sbGet('link_cards', 'is_active=eq.true&order=sort_order.asc');
  let links = [];

  if (linkRows && linkRows.length) {
    links = linkRows.map(lr => {
      const icon_type = lr.icon_type || 'custom';
      let custom_icon_src = null;
      if (icon_type === 'custom' && lr.icon_data) {
        if (lr.icon_data.length < 256) {
          custom_icon_src = `${SUPABASE_URL}/storage/v1/object/public/media/${lr.icon_data.replace(/^\//, '')}`;
        } else {
          const mime = lr.icon_mime || 'png';
          custom_icon_src = `data:image/${mime};base64,${lr.icon_data}`;
        }
      }
      return {
        id:          String(lr.id || ''),
        label:       lr.label        || '',
        sub:         lr.sub          || '',
        url:         lr.url          || '#',
        domain:      lr.domain       || '',
        desc:        lr.description  || '',
        btn:         lr.btn_label    || 'Buka Halaman',
        type:        icon_type,
        custom_icon: custom_icon_src,
      };
    });
  } else {
    links = FALLBACK_LINKS;
  }
  renderLinks(links);

  // DNS prefetch textures setelah kita tahu SUPABASE_URL
  if (SUPABASE_URL) {
    const texHost = new URL(SUPABASE_URL).hostname;
    const link1 = document.createElement('link');
    link1.rel = 'preconnect'; link1.href = `https://${texHost}`;
    document.head.appendChild(link1);
  }

  // Init 3D background setelah data siap
  initThree();
}

// ─── MODAL ────────────────────────────────────────────
let currentUrl = '';
function openModal(idx) {
  const d = LINKS[idx]; currentUrl = d.url;
  document.getElementById('mIco').innerHTML     = (ICON_HTML[d.type] || ICON_HTML.custom)(d);
  document.getElementById('mTitle').textContent  = d.label;
  document.getElementById('mDomain').textContent = d.domain;
  document.getElementById('mSaw').style.display  = d.type === 'saweria' ? 'block' : 'none';
  document.getElementById('mDesc').textContent   = d.desc;
  document.getElementById('btnLabel').textContent = d.btn;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function bgClose(e) { if (e.target === document.getElementById('overlay')) closeModal(); }
function goLink()   { window.open(currentUrl, '_blank', 'noopener,noreferrer'); closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ═══════════════════════════════════════════════════════
// THREE.JS — Solar System Background
// Heliosentris: Matahari di pusat, planet mengorbit sesuai urutan asli.
// Kamera mengorbit Matahari 360° secara horizontal saja (tanpa naik/turun).
// ═══════════════════════════════════════════════════════
function initThree() {
  const TEX_BASE = SUPABASE_URL
    ? `${SUPABASE_URL.replace(/\/$/, '')}/storage/v1/object/public/textures/`
    : '';

  const deg  = d => d * Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // Arah kutub utara rotasi tiap benda langit dari data IAU (RA, Dec, J2000) → vektor di kerangka ekliptika.
  // Dengan ini sumbu setiap planet condong ke ARAH berbeda, bukan hanya miring ke satu sisi yang sama.
  const OBLIQ = deg(23.4393);
  const UP = new THREE.Vector3(0, 1, 0);
  function poleVec(raDeg, decDeg) {
    const a = deg(raDeg), d = deg(decDeg);
    const xe = Math.cos(d) * Math.cos(a), ye = Math.cos(d) * Math.sin(a), ze = Math.sin(d);
    const X = xe, Y = ye * Math.cos(OBLIQ) + ze * Math.sin(OBLIQ), Z = -ye * Math.sin(OBLIQ) + ze * Math.cos(OBLIQ);
    return new THREE.Vector3(X, Z, -Y).normalize();      // ekliptika (x,y,z) → three (x, z=atas, -y)
  }

  const canvas   = document.getElementById('cosmos');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000105, 1);
  renderer.setSize(innerWidth, innerHeight);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 1, 7000);

  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ═════════════════════════════════════════════════════
  // SKALA & KONFIGURASI
  // ═════════════════════════════════════════════════════
  // Jarak orbit: urutan & perbandingan relatif mengikuti jarak asli (AU), tapi
  // dipadatkan (pangkat 0,35) supaya seluruh tata surya muat di layar.
  //   Merkurius 0.39 AU · Venus 0.72 · Bumi 1.00 · Mars 1.52 · (sabuk asteroid 2.2–3.2)
  //   Jupiter 5.20 · Saturnus 9.54 · Uranus 19.2 · Neptunus 30.1
  const SUN_R   = 34;
  const orbitR  = au => 2.3 + 75 * Math.pow(au, .35);

  // Kecepatan orbit: planet dalam lebih cepat dari planet luar (hukum Kepler),
  // dengan rentang dipadatkan (eksponen < 1) agar planet luar tidak terlihat diam.
  const EARTH_YEAR_SEC = 140;                 // 1 "tahun" Bumi = 140 detik layar
  const PERIOD_EXP     = 0.75;                // 1.0 = Kepler murni, makin kecil makin ringkas
  const BASE_W  = Math.PI * 2 / EARTH_YEAR_SEC;
  const orbitW  = yr => BASE_W * Math.pow(yr, -PERIOD_EXP);

  // Posisi awal planet = posisi nyata hari ini (longitudo rata-rata heliosentris dari epoch J2000)
  const daysJ2000 = (Date.now() - Date.UTC(2000, 0, 1, 12)) / 86400000;
  const meanLon   = (L0, yr) => deg(L0 + 360 * daysJ2000 / (yr * 365.25));

  // Kamera
  // FPP: kamera "melayang" DI DALAM tata surya (di antara orbit Saturnus & Uranus),
  // sedikit di atas bidang orbit, selalu menatap Matahari.
  const CAM_RADIUS    = 196;                  // jarak mendatar dari Matahari (tetap) — di antara orbit Saturnus & Uranus
  const CAM_HEIGHT    = 20;                   // tinggi di atas bidang orbit — TETAP (tidak bisa naik/turun)
  // Kemiringan seluruh bidang orbit terhadap kamera. 0 = sudut lurus (sejajar bidang orbit).
  // Isi mis. deg(23.4) kalau ingin bidang orbit dimiringkan (kamera perlu dinaikkan agar tidak menabrak orbit).
  const SYSTEM_TILT   = deg(0);
  const AUTO_SPEED    = reduceMotion ? 0 : 0.028;  // rad/detik — putaran pelan saat dibiarkan
  const DRAG_GAIN     = 2.6;                  // rad per lebar layar saat digeser

  // ═════════════════════════════════════════════════════
  // HELPER
  // ═════════════════════════════════════════════════════
  const texLoader = new THREE.TextureLoader();
  const maxAniso  = renderer.capabilities.getMaxAnisotropy();

  // Material dimulai dengan warna cadangan; tekstur dipasang saat berhasil dimuat.
  function applyTex(mat, file) {
    if (!TEX_BASE) return;
    texLoader.load(TEX_BASE + file, t => {
      t.anisotropy = maxAniso;
      if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
      mat.map = t;
      if ('emissiveMap' in mat) mat.emissiveMap = t;
      mat.color.set(0xffffff);
      mat.needsUpdate = true;
    }, undefined, () => { /* gagal muat → tetap pakai warna cadangan */ });
  }

  function cv(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return { c, x: c.getContext('2d') };
  }

  function glowTex(stops) {
    const { c, x } = cv(256, 256);
    const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }
  const dotTex = glowTex([[0, 'rgba(255,255,255,1)'], [.25, 'rgba(255,255,255,.85)'], [.6, 'rgba(255,255,255,.3)'], [1, 'rgba(255,255,255,0)']]);

  // ═════════════════════════════════════════════════════
  // LATAR: BINTANG & BIMASAKTI (mengelilingi 360°)
  // ═════════════════════════════════════════════════════
  const backdrop = new THREE.Group();
  scene.add(backdrop);

  function mkStars(n, rMin, rMax, size, op, color) {
    const g = new THREE.BufferGeometry(), p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u), r = rMin + Math.random() * (rMax - rMin);
      p[i*3] = r * s * Math.cos(th); p[i*3+1] = r * u; p[i*3+2] = r * s * Math.sin(th);
    }
    g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({
      size, map: dotTex, color, sizeAttenuation: false,
      transparent: true, opacity: op, alphaTest: .005, depthWrite: false,
    }));
    pts.renderOrder = -9;
    backdrop.add(pts);
  }
  mkStars(5200, 1500, 3000, 1.1, .55, 0xdce8ff);
  mkStars(1800, 1500, 3000, 1.7, .55, 0xc8d7ff);
  mkStars( 600, 1500, 3000, 2.4, .70, 0xffffff);
  mkStars( 120, 1500, 3000, 3.4, .85, 0xfff1d0);
  mkStars(  50, 1500, 3000, 4.4, .90, 0xffe0b8);
  mkStars(  18, 1500, 3000, 6.0, .90, 0xb4dcff);

  {
    const W = 2048, H = 1024, { c, x } = cv(W, H);
    const blob = (px, py, r, col) => {
      [-W, 0, W].forEach(o => {            // wrap horizontal supaya tidak ada sambungan
        const g = x.createRadialGradient(px + o, py, 0, px + o, py, r);
        g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g; x.fillRect(px + o - r, py - r, r * 2, r * 2);
      });
    };
    for (let i = 0; i < 420; i++) {
      const py = H / 2 + (Math.random() + Math.random() + Math.random() - 1.5) * 150;
      const col = `rgba(${90 + Math.random()*50|0},${110 + Math.random()*50|0},${190 + Math.random()*50|0},${.018 + Math.random()*.03})`;
      blob(Math.random() * W, py, 40 + Math.random() * 130, col);
    }
    blob(W * .32, H / 2,      320, 'rgba(120,140,230,.12)');
    blob(W * .78, H / 2 - 30, 260, 'rgba(130,70,190,.08)');
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(3200, 48, 32),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
    );
    sky.rotation.set(.3, 0, .45);
    sky.renderOrder = -10;
    backdrop.add(sky);
  }

  // Grup sistem: semua yang mengikuti bidang orbit (Matahari, planet, orbit, sabuk) ikut miring bersama
  const system = new THREE.Group();
  system.rotation.z = SYSTEM_TILT;
  scene.add(system);

  // ═════════════════════════════════════════════════════
  // MATAHARI (pusat tata surya)
  // ═════════════════════════════════════════════════════
  function sunFallbackTex() {
    const { c, x } = cv(512, 256);
    const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#ff9a1f'); g.addColorStop(.5, '#ffc23d'); g.addColorStop(1, '#ff9a1f');
    x.fillStyle = g; x.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 900; i++) {
      x.fillStyle = Math.random() < .5 ? 'rgba(255,225,120,.18)' : 'rgba(200,70,0,.14)';
      x.beginPath(); x.arc(Math.random() * 512, Math.random() * 256, 2 + Math.random() * 10, 0, 7); x.fill();
    }
    return new THREE.CanvasTexture(c);
  }
  const sunMat = new THREE.MeshBasicMaterial({ map: sunFallbackTex() });
  const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 128, 128), sunMat);
  applyTex(sunMat, 'sun.jpg');
  const sunTilt = new THREE.Group();          // sumbu putar Matahari (kutub IAU: miring ±7,25° dari normal ekliptika)
  sunTilt.quaternion.setFromUnitVectors(UP, poleVec(286.13, 63.87));
  sunTilt.add(sun);
  system.add(sunTilt);

  const halo1 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex([[0, 'rgba(255,214,140,.95)'], [.18, 'rgba(255,170,70,.55)'], [.45, 'rgba(255,120,30,.16)'], [1, 'rgba(255,90,0,0)']]),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  }));
  halo1.scale.setScalar(SUN_R * 5);
  scene.add(halo1);

  const halo2 = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex([[0, 'rgba(255,200,120,.22)'], [.4, 'rgba(255,140,60,.07)'], [1, 'rgba(255,100,20,0)']]),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
  }));
  halo2.scale.setScalar(SUN_R * 10);
  scene.add(halo2);

  // ── PENCAHAYAAN: satu-satunya sumber cahaya = Matahari di titik pusat ──
  scene.add(new THREE.PointLight(0xfff1d6, 2.3, 0));     // distance 0 → tanpa peredaman
  scene.add(new THREE.AmbientLight(0x2a3550, .95));

  // ═════════════════════════════════════════════════════
  // PLANET (urutan asli dari Matahari)
  // ═════════════════════════════════════════════════════
  // au: jarak rata-rata · yr: periode orbit (tahun Bumi) · L0: longitudo rata-rata J2000 (°)
  // incl: inklinasi orbit (°) · node: bujur simpul naik (°) — arah miringnya orbit · pole: [RA, Dec] kutub utara rotasi (IAU) · r: radius tampilan · spin: detik/putaran (negatif = retrograde)
  const PLANETS = [
    { key:'mercury', tex:'mercury.jpg', col:0x8c8379, au:.387,  yr:.2408, L0:252.25, incl:7.00, node:48.331, pole:[281.0103, 61.4155], r:1.6, spin:240, shin: 3, spec:[.04,.03,.02], emis:0x120e08, ei:.06 },
    { key:'venus',   tex:'venus.jpg',   col:0xd8b374, au:.723,  yr:.6152, L0:181.98, incl:3.39, node:76.68, pole:[272.76, 67.16], r:3.2, spin:-300, shin:38, spec:[.18,.14,.06], emis:0x1a1005, ei:.12 },
    { key:'earth',   tex:'earth.jpg',   col:0x2f6fb5, au:1.000, yr:1.000, L0:100.46, incl:0.00, node:0, pole:[0, 90], r:3.4, spin: 60, shin:10, spec:[.08,.16,.35], emis:0x0a0e18, ei:.06 },
    { key:'mars',    tex:'mars.jpg',    col:0xb5532f, au:1.524, yr:1.881, L0:355.43, incl:1.85, node:49.579, pole:[317.68143, 52.8865], r:2.1, spin: 62, shin: 4, spec:[.06,.02,.01], emis:0x100402, ei:.07 },
    { key:'jupiter', tex:'jupiter.jpg', col:0xc9a27a, au:5.203, yr:11.862,L0: 34.35, incl:1.30, node:100.556, pole:[268.056595, 64.495303], r:9.0, spin: 26, shin:16, spec:[.10,.08,.04], emis:0x100a04, ei:.09 },
    { key:'saturn',  tex:'saturn.jpg',  col:0xd9c28a, au:9.537, yr:29.457,L0: 50.08, incl:2.49, node:113.715, pole:[40.589, 83.537], r:7.5, spin: 28, shin:18, spec:[.12,.10,.05], emis:0x0e0a04, ei:.08, ring:true },
    { key:'uranus',  tex:'uranus.jpg',  col:0x8fd0d8, au:19.19, yr:84.02, L0:314.06, incl:0.77, node:74.23, pole:[257.311, -15.175], r:5.2, spin:-44, shin:42, spec:[.08,.18,.22], emis:0x030c10, ei:.10 },
    { key:'neptune', tex:'neptune.jpg', col:0x3f62d6, au:30.07, yr:164.8, L0:304.35, incl:1.77, node:131.722, pole:[299.36, 43.46], r:5.0, spin: 42, shin:48, spec:[.06,.10,.28], emis:0x02050e, ei:.10 },
  ];

  const bodies = [];
  let earthBody = null;

  PLANETS.forEach(def => {
    const R = orbitR(def.au);

    const orbit = new THREE.Group();                       // bidang orbit (inklinasi)
    orbit.rotation.set(deg(def.incl), deg(def.node), 0, 'YXZ');      // bidang orbit: miring sebesar incl ke arah simpul naik
    system.add(orbit);

    // garis orbit tipis
    const pts = [];
    for (let i = 0; i <= 256; i++) {
      const a = i / 256 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * R, 0, -Math.sin(a) * R));
    }
    orbit.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x9db7ff, transparent: true, opacity: .26, depthWrite: false })
    ));

    const holder = new THREE.Group(); orbit.add(holder);   // titik planet di orbit
    const tilt   = new THREE.Group(); holder.add(tilt);                                      // arah & kemiringan sumbu
    // orientasi sumbu ditentukan di kerangka ekliptika, lalu dikurangi rotasi bidang orbit induknya
    tilt.quaternion.copy(orbit.quaternion).invert()
      .multiply(new THREE.Quaternion().setFromUnitVectors(UP, poleVec(def.pole[0], def.pole[1])));

    const mat = new THREE.MeshPhongMaterial({
      color: def.col, shininess: def.shin, specular: new THREE.Color(...def.spec),
      emissive: new THREE.Color(def.emis), emissiveIntensity: def.ei,
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(def.r, 96, 96), mat);
    tilt.add(mesh);
    applyTex(mat, def.tex);

    const body = {
      def, R, holder, tilt, mesh,
      L: meanLon(def.L0, def.yr),
      node: deg(def.node),
      w: orbitW(def.yr),
      spinW: Math.PI * 2 / def.spin,
    };

    // Cincin Saturnus (sebidang dengan ekuator, ikut miring bersama sumbu)
    if (def.ring) {
      const inner = def.r * 1.28, outer = def.r * 2.65;
      const ringGeo = new THREE.RingGeometry(inner, outer, 256, 1);
      const pos = ringGeo.attributes.position, uv = ringGeo.attributes.uv, v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        uv.setXY(i, (v.length() - inner) / (outer - inner), .5);
      }
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xcdb892, side: THREE.DoubleSide, transparent: true, opacity: .92, depthWrite: false });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      tilt.add(ring);
      applyTex(ringMat, 'saturn_ring.png');
    }

    // Bumi: atmosfer, shader gelombang 4D, dan Bulan
    if (def.key === 'earth') {
      const eR = def.r;
      [
        { r: eR*1.012, op: .22,  c: new THREE.Color(.4, .6, .95) },
        { r: eR*1.03,  op: .12,  c: new THREE.Color(.3, .5, .9)  },
        { r: eR*1.06,  op: .06,  c: new THREE.Color(.2, .4, .82) },
        { r: eR*1.1,   op: .03,  c: new THREE.Color(.14,.32,.75) },
        { r: eR*1.16,  op: .014, c: new THREE.Color(.1, .25,.65) },
      ].forEach(({ r, op, c }) => {
        tilt.add(new THREE.Mesh(
          new THREE.SphereGeometry(r, 48, 48),
          new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, side: THREE.FrontSide, depthWrite: false, blending: THREE.AdditiveBlending })
        ));
      });

      const w4dMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide,
        uniforms: { time: { value: 0 }, w4: { value: 0 }, opacity: { value: 0 } },
        vertexShader: `
          uniform float time;uniform float w4;varying float vW4;varying vec3 vNorm;
          void main(){
            vNorm=normalize(normalMatrix*normal);
            float phi=atan(position.y,position.x);float theta=asin(position.z/length(position));
            float w4proj=sin(phi*3.0+theta*2.0+time*.6)*cos(w4*1.8+time*.35)*.012;
            vec3 displaced=position*(1.0+w4proj);vW4=w4proj;
            gl_Position=projectionMatrix*modelViewMatrix*vec4(displaced,1.0);
          }`,
        fragmentShader: `
          uniform float opacity;varying float vW4;varying vec3 vNorm;
          void main(){
            float fresnel=pow(1.0-abs(dot(vNorm,vec3(0.0,0.0,1.0))),3.2);
            float col4d=vW4*80.0+0.5;
            vec3 c=mix(vec3(.12,.48,1.),vec3(.8,.3,1.),col4d)*fresnel;
            gl_FragColor=vec4(c,fresnel*opacity*.55);
          }`,
      });
      const w4dMesh = new THREE.Mesh(new THREE.SphereGeometry(eR * 1.08, 48, 48), w4dMat);
      tilt.add(w4dMesh);

      // Bulan — mengorbit Bumi, selalu menghadapkan sisi yang sama (tidally locked)
      const moonTilt  = new THREE.Group(); moonTilt.rotation.z = deg(5.1); holder.add(moonTilt);
      const moonPivot = new THREE.Group(); moonPivot.rotation.y = Math.random() * Math.PI * 2; moonTilt.add(moonPivot);
      const moonMat = new THREE.MeshPhongMaterial({
        color: 0xa7a7a7, shininess: 2, specular: new THREE.Color(.04, .04, .04),
        emissive: new THREE.Color(0x111008), emissiveIntensity: .08,
      });
      const moon = new THREE.Mesh(new THREE.SphereGeometry(.9, 48, 48), moonMat);
      moon.position.set(8, 0, 0);
      moonPivot.add(moon);
      applyTex(moonMat, 'moon.jpg');

      earthBody = { mesh, w4dMat, w4dMesh, moonPivot, moonW: Math.PI * 2 / 36 };
    }

    bodies.push(body);
  });

  // ═════════════════════════════════════════════════════
  // SABUK ASTEROID (antara Mars & Jupiter, ±2.2–3.2 AU)
  // ═════════════════════════════════════════════════════
  const belt = new THREE.Group();
  system.add(belt);
  {
    const N = 3200, g = new THREE.BufferGeometry(), p = new Float32Array(N * 3);
    const r0 = orbitR(2.2), r1 = orbitR(3.2);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = r0 + Math.random() * (r1 - r0);
      p[i*3] = Math.cos(a) * r; p[i*3+1] = (Math.random() - .5) * 3.2; p[i*3+2] = -Math.sin(a) * r;
    }
    g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    belt.add(new THREE.Points(g, new THREE.PointsMaterial({
      size: 1.5, map: dotTex, color: 0xb3a08a, sizeAttenuation: false,
      transparent: true, opacity: .55, alphaTest: .005, depthWrite: false,
    })));
  }
  const beltW = orbitW(4.4);

  // ═════════════════════════════════════════════════════
  // KAMERA: orbit horizontal 360° mengelilingi Matahari
  // ═════════════════════════════════════════════════════
  let az = Math.PI * .5;       // sudut kamera mengitari Matahari (tak terbatas → 360° bebas)
  let azVel = AUTO_SPEED;      // kecepatan sudut (rad/detik)
  let camBreath = 0;           // "napas" jarak sangat halus agar terasa hidup (bukan gerak naik/turun)

  function placeCamera() {
    const r = CAM_RADIUS + camBreath;
    camera.position.set(Math.cos(az) * r, CAM_HEIGHT, Math.sin(az) * r);   // tinggi konstan → tak bisa naik/turun
    camera.lookAt(0, 0, 0);                                                // Matahari selalu di tengah layar
  }

  function layout() {
    const w = innerWidth, h = innerHeight, aspect = w / h;
    renderer.setSize(w, h);
    camera.aspect = aspect;
    camera.fov = aspect < 1 ? 78 : 56;      // lensa lebar → kesan berada di dalam tata surya
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  layout();

  // ── Input: geser horizontal (mouse/touch), roda horizontal, tombol panah ──
  let dragging = false, dragId = null, lastX = 0, lastT = 0, dragVel = 0;

  document.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest && e.target.closest('.link-btn, button, a, .overlay, .close-btn')) return;
    document.body.classList.add('dragged');
    dragging = true; dragId = e.pointerId; lastX = e.clientX; lastT = performance.now(); dragVel = 0; azVel = 0;
    document.body.classList.add('dragging');
  });
  window.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== dragId) return;
    const now = performance.now(), dt = Math.max(1, now - lastT) / 1000;
    const dAz = (e.clientX - lastX) / innerWidth * DRAG_GAIN;      // geser kanan → kamera berputar ke kiri (seperti "menggenggam" dunia)
    az += dAz;
    dragVel = dragVel * .6 + (dAz / dt) * .4;
    lastX = e.clientX; lastT = now;
  });
  function endDrag(e) {
    if (!dragging || (e && e.pointerId !== dragId)) return;
    dragging = false;
    document.body.classList.remove('dragging');
    azVel = clamp(dragVel, -5, 5);                                 // inersia halus, lalu kembali ke putaran pelan
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  window.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) az -= e.deltaX * .0015;
  }, { passive: true });

  window.addEventListener('keydown', e => {
    if (document.getElementById('overlay').classList.contains('open')) return;
    if (e.key === 'ArrowLeft')  azVel = clamp(azVel + .9, -5, 5);
    if (e.key === 'ArrowRight') azVel = clamp(azVel - .9, -5, 5);
  });

  // ═════════════════════════════════════════════════════
  // LOOP ANIMASI
  // ═════════════════════════════════════════════════════
  let T = 0, last = performance.now();

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;

    // kamera: kecepatan mengendur kembali ke putaran pelan
    if (!dragging) {
      az += azVel * dt;
      azVel += (AUTO_SPEED - azVel) * (1 - Math.exp(-dt * 1.4));
    }
    camBreath = Math.sin(T * .22) * 1.8;
    placeCamera();

    // planet: mengitari Matahari + berotasi pada sumbunya
    bodies.forEach(b => {
      b.L += b.w * dt;
      const th = b.L - b.node;                                           // sudut di bidang orbit, diukur dari simpul naik
      b.holder.position.set(Math.cos(th) * b.R, 0, -Math.sin(th) * b.R);
      b.mesh.rotation.y += b.spinW * dt;
    });
    belt.rotation.y += beltW * dt;

    // Bumi: Bulan & efek gelombang 4D
    if (earthBody) {
      earthBody.moonPivot.rotation.y += earthBody.moonW * dt;
      const w4val = Math.sin(T * .05) * Math.cos(T * .03) + Math.cos(T * .02) * .4;
      earthBody.w4dMat.uniforms.time.value = T;
      earthBody.w4dMat.uniforms.w4.value = w4val;
      earthBody.w4dMat.uniforms.opacity.value = .18 + Math.abs(w4val) * .22;
      earthBody.w4dMesh.rotation.y = earthBody.mesh.rotation.y * .6;
    }

    // Matahari: rotasi sangat lambat + napas halus
    sun.rotation.y += (Math.PI * 2 / 600) * dt;
    const pulse = 1 + Math.sin(T * .88) * .012 + Math.sin(T * 2.28) * .005;
    sun.scale.setScalar(pulse);
    halo1.material.opacity = .92 + Math.sin(T * .9) * .08;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
}

// ─── KICK OFF ─────────────────────────────────────────
// Gunakan flag + callback — anti race condition
function __startApp() {
  const CFG2 = window.APP_CONFIG || {};
  SUPABASE_URL  = CFG2.SUPABASE_URL  || '';
  SUPABASE_ANON = CFG2.SUPABASE_ANON || '';

  console.group('[Profil Config]');
  console.log('APP_CONFIG loaded:', !!window.APP_CONFIG);
  console.log('SUPABASE_URL:', SUPABASE_URL ? SUPABASE_URL.replace(/\/\/.*\.supabase/, '//[hidden].supabase') : '❌ KOSONG');
  console.log('SUPABASE_ANON:', SUPABASE_ANON ? '✅ ada (' + SUPABASE_ANON.length + ' karakter)' : '❌ KOSONG');
  if (!SUPABASE_URL || !SUPABASE_ANON) {
    console.warn('Config belum terisi — pakai fallback data.');
  }
  console.groupEnd();

  init();
}

// Kalau config.js sudah selesai load sebelum script ini jalan → langsung start
// Kalau belum → pasang callback, nanti dipanggil oleh __onConfigLoaded()
if (window.__configReady) {
  __startApp();
} else {
  window.__configCallback = __startApp;
}
</script>
</body>
</html>
