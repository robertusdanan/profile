name: Deploy to GitHub Pages

# Tanpa secret & tanpa database: situs murni file statis di repo ini.
# Setiap commit ke main (termasuk dari Admin Panel) otomatis ter-deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan file situs
        run: |
          mkdir _site
          cp index.html admin.html favicon.ico og.jpg _site/
          cp -r data assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
